<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Prediction ML</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 30px 15px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            color: #cbd5e1;
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        .button-container {
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            text-align: center;
            padding: 30px;
            display: none;
        }

        .result h3 {
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .prediction {
            font-size: 42px;
            font-weight: bold;
            color: #38bdf8;
        }

        .error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fecaca;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }

            .prediction {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Sales Prediction ML</h1>
        <p>Machine Learning powered sales prediction system</p>
    </div>

    <div class="card">

        <h2>Enter Sales Information</h2>

        <div class="grid">

            <div class="field">
                <label>Branch</label>
                <select id="Branch">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>

            <div class="field">
                <label>City</label>
                <select id="City">
                    <option value="Yangon">Yangon</option>
                    <option value="Mandalay">Mandalay</option>
                    <option value="Naypyitaw">Naypyitaw</option>
                </select>
            </div>

            <div class="field">
                <label>Customer Type</label>
                <select id="Customer_type">
                    <option value="Member">Member</option>
                    <option value="Normal">Normal</option>
                </select>
            </div>

            <div class="field">
                <label>Gender</label>
                <select id="Gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="field">
                <label>Product Line</label>
                <select id="Product_line">
                    <option value="Health and beauty">Health and beauty</option>
                    <option value="Electronic accessories">Electronic accessories</option>
                    <option value="Home and lifestyle">Home and lifestyle</option>
                    <option value="Sports and travel">Sports and travel</option>
                    <option value="Food and beverages">Food and beverages</option>
                    <option value="Fashion accessories">Fashion accessories</option>
                </select>
            </div>

            <div class="field">
                <label>Payment</label>
                <select id="Payment">
                    <option value="Cash">Cash</option>
                    <option value="Credit card">Credit card</option>
                    <option value="Ewallet">Ewallet</option>
                </select>
            </div>

            <div class="field">
                <label>Unit Price</label>
                <input type="number" id="Unit_price" step="0.01" value="50">
            </div>

            <div class="field">
                <label>Quantity</label>
                <input type="number" id="Quantity" value="5">
            </div>

            <div class="field">
                <label>Tax 5%</label>
                <input type="number" id="Tax_5" step="0.01" value="12.5">
            </div>

            <div class="field">
                <label>Total</label>
                <input type="number" id="Total" step="0.01" value="262.5">
            </div>

            <div class="field">
                <label>COGS</label>
                <input type="number" id="cogs" step="0.01" value="250">
            </div>

            <div class="field">
                <label>Gross Margin Percentage</label>
                <input
                    type="number"
                    id="gross_margin_percentage"
                    step="0.01"
                    value="4.7619"
                >
            </div>

            <div class="field">
                <label>Gross Income</label>
                <input
                    type="number"
                    id="gross_income"
                    step="0.01"
                    value="12.5"
                >
            </div>

            <div class="field">
                <label>Rating</label>
                <input
                    type="number"
                    id="Rating"
                    step="0.01"
                    min="0"
                    max="10"
                    value="7"
                >
            </div>

            <div class="field">
                <label>Month</label>
                <input
                    type="number"
                    id="Month"
                    min="1"
                    max="12"
                    value="1"
                >
            </div>

            <div class="field">
                <label>Year</label>
                <input
                    type="number"
                    id="Year"
                    value="2019"
                >
            </div>

            <div class="field">
                <label>Day Of Week</label>
                <input
                    type="number"
                    id="DayOfWeek"
                    min="0"
                    max="6"
                    value="1"
                >
            </div>

        </div>

        <div class="button-container">
            <button id="predictButton" onclick="predictSales()">
                Predict Sales
            </button>
        </div>

        <div class="loading" id="loading">
            🔄 Predicting sales...
        </div>

        <div class="error" id="error"></div>

    </div>

    <div class="card result" id="result">

        <h3>Predicted Sales</h3>

        <div class="prediction" id="prediction">
            ₹0.00
        </div>

    </div>

    <div class="footer">
        Built with Python, Scikit-Learn, FastAPI & Machine Learning
    </div>

</div>


<script>

async function predictSales() {

    const button = document.getElementById("predictButton");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");
    const predictionBox = document.getElementById("prediction");

    // Hide previous messages
    errorBox.style.display = "none";
    resultBox.style.display = "none";

    // Loading state
    button.disabled = true;
    button.innerText = "Predicting...";
    loading.style.display = "block";

    const data = {

        Branch: document.getElementById("Branch").value,

        City: document.getElementById("City").value,

        Customer_type:
            document.getElementById("Customer_type").value,

        Gender:
            document.getElementById("Gender").value,

        Product_line:
            document.getElementById("Product_line").value,

        Payment:
            document.getElementById("Payment").value,

        Unit_price:
            Number(document.getElementById("Unit_price").value),

        Quantity:
            Number(document.getElementById("Quantity").value),

        Tax_5:
            Number(document.getElementById("Tax_5").value),

        Total:
            Number(document.getElementById("Total").value),

        cogs:
            Number(document.getElementById("cogs").value),

        gross_margin_percentage:
            Number(
                document.getElementById(
                    "gross_margin_percentage"
                ).value
            ),

        gross_income:
            Number(
                document.getElementById("gross_income").value
            ),

        Rating:
            Number(document.getElementById("Rating").value),

        Month:
            Number(document.getElementById("Month").value),

        Year:
            Number(document.getElementById("Year").value),

        DayOfWeek:
            Number(document.getElementById("DayOfWeek").value)
    };


    try {

        /*
         * IMPORTANT:
         * Replace this URL with your Render Primary URL.
         *
         * Example:
         * https://sales-prediction-api.onrender.com/predict
         */

        const response = await fetch(
            "https://sales-prediction-ml-hej2.onrender.com/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Prediction request failed."
            );
        }


        predictionBox.innerText =
            "₹ " +
            Number(result.predicted_sales).toFixed(2);


        resultBox.style.display = "block";

    }

    catch (error) {

        errorBox.innerText =
            "❌ " + error.message;

        errorBox.style.display = "block";

    }

    finally {

        loading.style.display = "none";

        button.disabled = false;

        button.innerText = "Predict Sales";
    }

}

</script>

</body>
</html>
